[project]
name = "qemu-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents boot and drive QEMU virtual machines - keystrokes, screenshots, serial console, QMP."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2.0.0", "pillow>=10.0"]
keywords = ["mcp", "qemu", "osdev", "virtual-machine", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/0xmortuex/qemu-mcp"

[project.scripts]
qemu-mcp = "qemu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qemu_mcp"]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't silently change what "default" means
# out from under CI (0.16.0 started flagging SIM/RUF checks that 0.15.8 didn't).
# This is ruff's own documented default subset (pyflakes + pycodestyle errors).
select = ["E4", "E7", "E9", "F"]
